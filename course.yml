course:
  name: AI Engineering for Asset Management
  subtitle: Build a Financial Analyst Copilot in Two Days
  author: Arnaud Demes
  language: en
  format: notebook-first technical workshop
  blueprint: docs/program-blueprint.md
  capstone: Financial Analyst Copilot

brand:
  signature: "FinAI Academy - Arnaud Demes"
  logo: none
  primary: "#051C2A"
  royal_blue: "#1F40CB"
  cyan: "#00A2EB"
  orange: "#F07D00"
  off_white: "#F5F5F5"

delivery:
  two_day:
    day_start: "09:00"
    day_end: "17:00"
    lunch:
      start: "12:00"
      end: "13:30"
    breaks:
      - day: 1
        start: "10:30"
        end: "10:45"
      - day: 1
        start: "15:00"
        end: "15:15"
      - day: 2
        start: "10:15"
        end: "10:30"

lessons:

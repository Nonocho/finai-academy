[project]
name = "finai-academy"
version = "0.1.0"
description = "Hands-on AI systems engineering for financial research"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Arnaud Demes" }
]
dependencies = [
  "ipykernel",
  "ipywidgets",
  "jupyterlab",
  "matplotlib",
  "mcp[cli]>=2,<3",
  "nbclient",
  "nbformat",
  "numpy",
  "pandas",
  "beautifulsoup4",
  "pdfplumber",
  "pydantic>=2",
  "pyyaml",
  "python-dotenv",
  "scikit-learn",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
ai = [
  "langchain",
  "langchain-community",
  "langchain-ollama",
  "langchain-openai",
  "langgraph",
  "openai",
]
rag = [
  "docling",
  "flashrank",
  "pdfplumber",
]
finance = [
  "edgartools",
  "yfinance",
]
evaluation = [
  "mlflow>=3.15,<4",
  "ragas>=0.4.3,<0.5",
]
dev = [
  "pytest",
  "ruff",
]
capstone = [
  "streamlit>=1.40,<2",
  "mlflow>=3.15,<4",
  "pymupdf==1.28.2",
  "pymupdf4llm==1.28.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
